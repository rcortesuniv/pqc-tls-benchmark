name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: make test
      - name: Check Python and shell syntax
        run: |
          python -m py_compile scripts/*.py analysis/*.py
          bash -n scripts/*.sh
      - name: Validate the dry-run matrix
        run: python scripts/run-experiment.py --dry-run --max-cells 2
